name: Extension CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'apps/extension/**'
      - 'packages/ui/**'
      - 'packages/shared-types/**'
      - '.github/workflows/extension.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  extension-checks:
    name: Extension Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: extension-lint (ESLint)
        working-directory: apps/extension
        run: npm run lint --if-present

      - name: extension-typecheck (TypeScript)
        working-directory: apps/extension
        run: npm run typecheck --if-present

      - name: extension-test (Vitest)
        working-directory: apps/extension
        run: npm run test --if-present

      - name: extension-build (Vite)
        working-directory: apps/extension
        run: npm run build
