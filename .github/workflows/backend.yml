name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'services/api/**'
      - 'packages/shared-types/**'
      - 'pyproject.toml'
      - 'docker-compose*.yml'
      - '.github/workflows/backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ENVIRONMENT: "test"
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  backend-checks:
    name: Backend Lint, Typecheck, and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling
          pip install -e .[dev]

      - name: backend-lint (Ruff)
        run: ruff check .

      - name: backend-lint (Black)
        run: black --check .

      - name: backend-lint (isort)
        run: isort --check-only --profile black .

      - name: backend-typecheck (mypy)
        run: mypy src

      - name: backend-security (Bandit)
        run: bandit -r src -c pyproject.toml || bandit -r src

      - name: backend-test (pytest)
        run: |
          # Only run pytest if there are actually tests to run
          if [ -d "tests" ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            pytest
          else
            echo "No tests found. Skipping pytest."
          fi
